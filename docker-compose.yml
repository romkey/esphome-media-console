# Builds the firmware with a pinned ESPHome release.
#
#   cp src/example-local.yaml src/local.yaml   # then edit it
#   docker compose run --rm esphome            # compile the default config
#   CONFIG=examples/standalone-host.yaml docker compose run --rm esphome
#
# The finished images land in ./build/<device-name>/.
#
# Docker Desktop on macOS can't pass USB through, so flash the first time with
# the .factory.bin via https://web.esphome.io, then update over the air.

x-esphome: &esphome
  image: ghcr.io/esphome/esphome:2026.7.4
  working_dir: /config
  volumes:
    - ./src:/config
    - ./build:/build
    # The build tree and PlatformIO toolchains live in a named volume: much
    # faster than a bind mount, and nothing for Dropbox/Spotlight to index.
    - esphome-cache:/cache
  environment:
    ESPHOME_DATA_DIR: /cache/data

services:
  esphome:
    <<: *esphome
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        esphome compile "${CONFIG:-hosyond-4in-resistive.yaml}"
        name=$$(esphome config "${CONFIG:-hosyond-4in-resistive.yaml}" 2>/dev/null | sed -n 's/^  name: //p' | head -n1)
        out="/build/$${name:-firmware}"
        mkdir -p "$$out"
        find /cache/data -name 'firmware.factory.bin' -path "*/$${name}/*" -exec cp {} "$$out/" \; -o \
             -name 'firmware.ota.bin' -path "*/$${name}/*" -exec cp {} "$$out/" \;
        echo "Firmware copied to ./build/$${name:-firmware}/"

  # Optional: ESPHome dashboard on http://localhost:6052
  #   docker compose --profile dashboard up dashboard
  dashboard:
    <<: *esphome
    profiles: ["dashboard"]
    entrypoint: ["esphome"]
    command: ["dashboard", "/config"]
    ports:
      - "6052:6052"

volumes:
  esphome-cache:
