name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          # The Hosyond 4" board with the media console.
          - hosyond-4in-resistive.yaml
          # The media console in a project that doesn't use boards/. Keeps the
          # package independent of the board definition.
          - examples/standalone-host.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Use the placeholder local settings
        run: cp src/example-local.yaml src/local.yaml
      - name: Build
        env:
          CONFIG: ${{ matrix.config }}
        run: docker compose run --rm esphome
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ strategy.job-index }}
          path: build/**/*.bin
          if-no-files-found: error
