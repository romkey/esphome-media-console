# Media console on the Hosyond 4.0" ESP32-32E (resistive touch).
#
# Per-install settings (Wi-Fi, API key, OTA password, media_player, ha_base_url)
# live in local.yaml, which is gitignored. Start from example-local.yaml.

substitutions:
  name: media-console
  friendly_name: Media Console

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

packages:
  board: !include boards/hosyond-esp32-32e-4in/base.yaml
  touch: !include boards/hosyond-esp32-32e-4in/touch-resistive.yaml
  media_console: !include
    file: media_console/media_console.yaml
    vars:
      media_player: ${media_player}
      ha_base_url: ${ha_base_url}
      backlight_id: board_backlight
  # Last, so substitutions here override the package defaults above.
  local: !include local.yaml

logger:

wifi:
  ap:
    ssid: ${friendly_name} Fallback

captive_portal:
